# Render Blueprint — free tier deploy. No persistent disk needed because the
# vector index is pre-built locally (npm run ingest:local) and committed to
# the repo at backend/data/vectors.json. The server loads it on boot.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: millet-vista-rag
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # On the free tier we can't persist new uploads, so we point DATA_DIR
      # at the in-repo `data` folder. The pre-built vectors.json lives here.
      - key: DATA_DIR
        value: ./data
      - key: GEMINI_CHAT_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_EMBED_MODEL
        value: text-embedding-004
      - key: TOP_K
        value: "6"
      - key: CHUNK_SIZE
        value: "1100"
      - key: CHUNK_OVERLAP
        value: "180"
      - key: GEMINI_API_KEY
        sync: false   # paste in the dashboard
      - key: ADMIN_TOKEN
        sync: false   # paste in the dashboard (still required by the API)
      - key: CORS_ORIGIN
        sync: false
